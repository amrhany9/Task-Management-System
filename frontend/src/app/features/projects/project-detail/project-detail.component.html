<a
  class="mb-6 inline-flex items-center gap-1.5 rounded text-sm font-medium text-slate-500 transition hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 dark:text-slate-400 dark:hover:text-slate-100"
  routerLink="/projects"
>
  <span aria-hidden="true">&larr;</span> Back to projects
</a>

@if (errorMessage()) {
  <p class="alert-error mb-6" role="alert">{{ errorMessage() }}</p>
}

@if (isLoading()) {
  <div class="card mb-8 p-6" aria-busy="true" aria-live="polite">
    <span class="sr-only">Loading project…</span>
    <div class="skeleton h-5 w-1/3" aria-hidden="true"></div>
    <div class="skeleton mt-3 h-3 w-2/3" aria-hidden="true"></div>
  </div>
} @else if (project(); as p) {
  <div class="card mb-8 p-6">
    @if (isEditing()) {
      <form class="flex flex-col gap-3 sm:flex-row sm:items-center" (ngSubmit)="saveProject()">
        <div class="sm:flex-1">
          <label class="sr-only" for="edit-project-name">Project name</label>
          <input
            id="edit-project-name"
            name="editName"
            type="text"
            class="field-input"
            [(ngModel)]="editName"
            [disabled]="isSaving()"
            required
          />
        </div>
        <div class="sm:flex-1">
          <label class="sr-only" for="edit-project-description">Description</label>
          <input
            id="edit-project-description"
            name="editDescription"
            type="text"
            class="field-input"
            [(ngModel)]="editDescription"
            [disabled]="isSaving()"
          />
        </div>
        <div class="flex shrink-0 gap-2">
          <button type="submit" class="btn-primary" [disabled]="isNameMissing || isSaving()">
            {{ isSaving() ? 'Saving…' : 'Save' }}
          </button>
          <button type="button" class="btn-secondary" [disabled]="isSaving()" (click)="isEditing.set(false)">
            Cancel
          </button>
        </div>
      </form>
    } @else {
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div class="min-w-0">
          <h1 class="text-xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">{{ p.name }}</h1>
          <p class="mt-1.5 text-sm text-slate-500 dark:text-slate-400">{{ p.description || 'No description' }}</p>
        </div>
        <div class="flex shrink-0 gap-2">
          <button type="button" class="btn-secondary" (click)="startEditing()">Edit</button>
          <button type="button" class="btn-danger" (click)="requestDelete()">Delete project</button>
        </div>
      </div>
    }
  </div>

  <app-task-list [projectId]="p.id" />
}

@if (isConfirmingDelete() && project(); as p) {
  <app-confirm-dialog
    title="Delete project?"
    [message]="'“' + p.name + '” and all of its tasks will be permanently deleted.'"
    [isBusy]="isDeleting()"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  />
}
