<div class="flex flex-col gap-6 sm:gap-8">
  <a
    class="inline-flex w-fit items-center gap-1.5 rounded-lg text-sm font-semibold text-surface-500 transition hover:text-surface-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 dark:text-surface-400 dark:hover:text-white"
    routerLink="/projects"
  >
    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>
    Back to projects
  </a>

  @if (errorMessage()) {
    <p class="alert-error" role="alert">{{ errorMessage() }}</p>
  }

  @if (isLoading()) {
    <div class="card p-6" aria-busy="true" aria-live="polite">
      <span class="sr-only">Loading project…</span>
      <div class="skeleton h-6 w-1/3" aria-hidden="true"></div>
      <div class="skeleton mt-3 h-3 w-2/3" aria-hidden="true"></div>
    </div>
  } @else if (project(); as p) {
    <div class="card p-6">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div class="min-w-0">
          <h1 class="page-title">{{ p.name }}</h1>
          <p class="page-sub">{{ p.description || 'No description' }}</p>
        </div>
        <div class="flex shrink-0 gap-2">
          <button type="button" class="btn-secondary" (click)="openEdit()">Edit</button>
          <button type="button" class="btn-danger" (click)="requestDelete()">Delete project</button>
        </div>
      </div>
    </div>

    <app-task-list [projectId]="p.id" />
  }
</div>

@if (isEditOpen() && project(); as p) {
  <app-modal
    title="Edit project"
    subtitle="Update the name or description."
    size="sm"
    [isBusy]="isSaving()"
    (closed)="closeEdit()"
  >
    <app-project-form [project]="p" [isBusy]="isSaving()" (update)="saveProject($event)" />

    <div slot="footer">
      <button type="button" class="btn-secondary" [disabled]="isSaving()" (click)="closeEdit()">Cancel</button>
      <button type="submit" form="project-form" class="btn-primary" [disabled]="isSaving()">
        {{ isSaving() ? 'Saving…' : 'Save changes' }}
      </button>
    </div>
  </app-modal>
}

@if (isConfirmingDelete() && project(); as p) {
  <app-confirm-dialog
    title="Delete project?"
    [message]="'“' + p.name + '” and all of its tasks will be permanently deleted.'"
    [isBusy]="isDeleting()"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  />
}
