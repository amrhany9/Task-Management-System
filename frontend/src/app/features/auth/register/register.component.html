<div class="auth-card">
  <h1>Register</h1>

  <form (ngSubmit)="submit()" #registerForm="ngForm">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" [(ngModel)]="name" required autocomplete="name" />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      required
      minlength="8"
      autocomplete="new-password"
    />

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="registerForm.invalid || isSubmitting()">Create account</button>
  </form>

  <p>Already have an account? <a routerLink="/login">Log in</a></p>
</div>
