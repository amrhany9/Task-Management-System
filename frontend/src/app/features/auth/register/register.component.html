<div class="mx-auto w-full max-w-md">
  <div class="mb-8 text-center">
    <app-brand-mark class="mb-4" size="lg" />
    <h1 class="text-2xl font-bold tracking-tight text-surface-900 sm:text-3xl dark:text-white">Create your account</h1>
    <p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
      Start organising your work in a few seconds.
    </p>
  </div>

  <div class="card p-8">
    <form class="space-y-4" (ngSubmit)="submit()" #registerForm="ngForm">
      <div>
        <label class="field-label" for="name">Name</label>
        <input
          id="name"
          name="name"
          type="text"
          class="field-input"
          placeholder="Jane Doe"
          [(ngModel)]="name"
          [disabled]="isSubmitting()"
          required
          autocomplete="name"
        />
      </div>

      <div>
        <label class="field-label" for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          class="field-input"
          placeholder="you@example.com"
          [(ngModel)]="email"
          [disabled]="isSubmitting()"
          required
          autocomplete="email"
        />
      </div>

      <div>
        <label class="field-label" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="field-input"
          placeholder="At least 8 characters"
          [(ngModel)]="password"
          [disabled]="isSubmitting()"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </div>

      @if (errorMessage()) {
        <p class="alert-error" role="alert">{{ errorMessage() }}</p>
      }

      <div class="pt-2">
        <button type="submit" class="btn-primary w-full" [disabled]="registerForm.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Creating account…' : 'Create account' }}
        </button>
      </div>
    </form>

    <div class="mt-6">
      <app-google-sign-in-button
        mode="signup"
        [disabled]="isSubmitting()"
        (credential)="signUpWithGoogle($event)"
        (failed)="onGoogleUnavailable($event)"
      />
    </div>
  </div>

  <p class="mt-6 text-center text-sm text-surface-500 dark:text-surface-400">
    Already have an account?
    <a class="ml-1 font-semibold text-primary-600 transition hover:text-primary-500" routerLink="/login">Log in</a>
  </p>
</div>
