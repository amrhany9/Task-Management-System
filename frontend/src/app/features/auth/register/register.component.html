<div class="mx-auto w-full max-w-sm">
  <div class="mb-8 text-center">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Create your account</h1>
    <p class="mt-1.5 text-sm text-slate-500">Start organising your work in a few seconds.</p>
  </div>

  <div class="card p-6 sm:p-8">
    <form class="space-y-5" (ngSubmit)="submit()" #registerForm="ngForm">
      <div>
        <label class="field-label" for="name">Name</label>
        <input
          id="name"
          name="name"
          type="text"
          class="field-input"
          placeholder="Jane Doe"
          [(ngModel)]="name"
          required
          autocomplete="name"
        />
      </div>

      <div>
        <label class="field-label" for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          class="field-input"
          placeholder="you@example.com"
          [(ngModel)]="email"
          required
          autocomplete="email"
        />
      </div>

      <div>
        <label class="field-label" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="field-input"
          placeholder="At least 8 characters"
          [(ngModel)]="password"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </div>

      @if (errorMessage()) {
        <p class="alert-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-primary w-full" [disabled]="registerForm.invalid || isSubmitting()">
        {{ isSubmitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>
  </div>

  <p class="mt-6 text-center text-sm text-slate-500">
    Already have an account?
    <a class="font-medium text-indigo-600 hover:text-indigo-700" routerLink="/login">Log in</a>
  </p>
</div>
