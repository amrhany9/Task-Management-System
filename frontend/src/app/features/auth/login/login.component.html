<div class="mx-auto w-full max-w-sm">
  <div class="mb-8 text-center">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Welcome back</h1>
    <p class="mt-1.5 text-sm text-slate-500">Log in to manage your projects and tasks.</p>
  </div>

  <div class="card p-6 sm:p-8">
    <form class="space-y-5" (ngSubmit)="submit()" #loginForm="ngForm">
      <div>
        <label class="field-label" for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          class="field-input"
          placeholder="you@example.com"
          [(ngModel)]="email"
          required
          autocomplete="email"
        />
      </div>

      <div>
        <label class="field-label" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="field-input"
          placeholder="••••••••"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage()) {
        <p class="alert-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-primary w-full" [disabled]="loginForm.invalid || isSubmitting()">
        {{ isSubmitting() ? 'Logging in…' : 'Log in' }}
      </button>
    </form>
  </div>

  <p class="mt-6 text-center text-sm text-slate-500">
    No account yet?
    <a class="font-medium text-indigo-600 hover:text-indigo-700" routerLink="/register">Register</a>
  </p>
</div>
