<div class="mx-auto w-full max-w-md">
  <div class="mb-8 text-center">
    <app-brand-mark class="mb-4" size="lg" />
    <h1 class="text-2xl font-bold tracking-tight text-surface-900 sm:text-3xl dark:text-white">Welcome back</h1>
    <p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
      Log in to manage your projects and tasks.
    </p>
  </div>

  <div class="card p-8">
    <form class="space-y-4" (ngSubmit)="submit()" #loginForm="ngForm">
      <div>
        <label class="field-label" for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          class="field-input"
          placeholder="you@example.com"
          [(ngModel)]="email"
          [disabled]="isSubmitting()"
          required
          autocomplete="email"
        />
      </div>

      <div>
        <label class="field-label" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="field-input"
          placeholder="••••••••"
          [(ngModel)]="password"
          [disabled]="isSubmitting()"
          required
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage()) {
        <p class="alert-error" role="alert">{{ errorMessage() }}</p>
      }

      <div class="pt-2">
        <button type="submit" class="btn-primary w-full" [disabled]="loginForm.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Logging in…' : 'Log in' }}
        </button>
      </div>
    </form>
  </div>

  <p class="mt-6 text-center text-sm text-surface-500 dark:text-surface-400">
    No account yet?
    <a class="ml-1 font-semibold text-primary-600 transition hover:text-primary-500" routerLink="/register">
      Create one
    </a>
  </p>
</div>
