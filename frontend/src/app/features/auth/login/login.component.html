<div class="auth-card">
  <h1>Log in</h1>

  <form (ngSubmit)="submit()" #loginForm="ngForm">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" />

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="loginForm.invalid || isSubmitting()">Log in</button>
  </form>

  <p>No account yet? <a routerLink="/register">Register</a></p>
</div>
