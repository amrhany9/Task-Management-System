<form class="flex flex-col gap-3" (ngSubmit)="submit()">
  <div class="flex flex-col gap-3 sm:flex-row">
    <input
      name="title"
      type="text"
      class="field-input sm:flex-1"
      placeholder="Task title"
      [(ngModel)]="title"
      required
    />
    <input
      name="description"
      type="text"
      class="field-input sm:flex-1"
      placeholder="Description (optional)"
      [(ngModel)]="description"
    />
  </div>

  <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
    <select name="status" class="field-input sm:w-40" [(ngModel)]="status">
      @for (s of statuses; track s) {
        <option [value]="s">{{ s | taskStatusLabel }}</option>
      }
    </select>

    <select name="priority" class="field-input sm:w-40" [(ngModel)]="priority">
      @for (p of priorities; track p) {
        <option [value]="p">{{ p | taskPriorityLabel }}</option>
      }
    </select>

    <input name="dueDate" type="date" class="field-input sm:w-44" [(ngModel)]="dueDate" />

    <div class="flex gap-2 sm:ml-auto">
      <button type="submit" class="btn-primary">{{ task ? 'Save' : 'Add task' }}</button>
      @if (task) {
        <button type="button" class="btn-secondary" (click)="cancel.emit()">Cancel</button>
      }
    </div>
  </div>
</form>
