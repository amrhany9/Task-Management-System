<form class="flex flex-col gap-3" (ngSubmit)="submit()">
  <div class="flex flex-col gap-3 sm:flex-row">
    <div class="sm:flex-1">
      <label class="sr-only" [attr.for]="task ? 'edit-title' : 'new-title'">Task title</label>
      <input
        [id]="task ? 'edit-title' : 'new-title'"
        name="title"
        type="text"
        class="field-input"
        placeholder="Task title"
        [(ngModel)]="title"
        [disabled]="isBusy"
        required
      />
    </div>
    <div class="sm:flex-1">
      <label class="sr-only" [attr.for]="task ? 'edit-description' : 'new-description'">Description</label>
      <input
        [id]="task ? 'edit-description' : 'new-description'"
        name="description"
        type="text"
        class="field-input"
        placeholder="Description (optional)"
        [(ngModel)]="description"
        [disabled]="isBusy"
      />
    </div>
  </div>

  <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
    @if (task) {
      <div>
        <label class="sr-only" for="edit-status">Status</label>
        <select id="edit-status" name="status" class="field-input sm:w-40" [(ngModel)]="status" [disabled]="isBusy">
          @for (s of statuses; track s) {
            <option [value]="s">{{ s | taskStatusLabel }}</option>
          }
        </select>
      </div>
    }

    <div>
      <label class="sr-only" [attr.for]="task ? 'edit-priority' : 'new-priority'">Priority</label>
      <select
        [id]="task ? 'edit-priority' : 'new-priority'"
        name="priority"
        class="field-input sm:w-40"
        [(ngModel)]="priority"
        [disabled]="isBusy"
      >
        @for (p of priorities; track p) {
          <option [value]="p">{{ p | taskPriorityLabel }}</option>
        }
      </select>
    </div>

    <div>
      <label class="sr-only" [attr.for]="task ? 'edit-due' : 'new-due'">Due date</label>
      <input
        [id]="task ? 'edit-due' : 'new-due'"
        name="dueDate"
        type="date"
        class="field-input sm:w-44"
        [(ngModel)]="dueDate"
        [disabled]="isBusy"
      />
    </div>

    <div class="flex gap-2 sm:ml-auto">
      <button type="submit" class="btn-primary" [disabled]="isTitleMissing || isBusy">
        @if (isBusy) {
          {{ task ? 'Saving…' : 'Adding…' }}
        } @else {
          {{ task ? 'Save' : 'Add task' }}
        }
      </button>
      @if (task) {
        <button type="button" class="btn-secondary" [disabled]="isBusy" (click)="cancel.emit()">Cancel</button>
      }
    </div>
  </div>
</form>
