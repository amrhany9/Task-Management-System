<form id="task-form" class="flex flex-col gap-4" (ngSubmit)="submit()">
  <div>
    <label class="field-label" for="task-title">Title</label>
    <input
      id="task-title"
      name="title"
      type="text"
      class="field-input"
      placeholder="e.g. Draft the launch checklist"
      [(ngModel)]="title"
      [disabled]="isBusy"
      required
    />
  </div>

  <div>
    <label class="field-label" for="task-description">Description</label>
    <input
      id="task-description"
      name="description"
      type="text"
      class="field-input"
      placeholder="Optional detail"
      [(ngModel)]="description"
      [disabled]="isBusy"
    />
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    @if (task) {
      <div>
        <label class="field-label" for="task-status">Status</label>
        <select id="task-status" name="status" class="field-input" [(ngModel)]="status" [disabled]="isBusy">
          @for (s of statuses; track s) {
            <option [value]="s">{{ s | taskStatusLabel }}</option>
          }
        </select>
      </div>
    }

    <div>
      <label class="field-label" for="task-priority">Priority</label>
      <select id="task-priority" name="priority" class="field-input" [(ngModel)]="priority" [disabled]="isBusy">
        @for (p of priorities; track p) {
          <option [value]="p">{{ p | taskPriorityLabel }}</option>
        }
      </select>
    </div>

    <div>
      <label class="field-label" for="task-due">Due date</label>
      <input id="task-due" name="dueDate" type="date" class="field-input" [(ngModel)]="dueDate" [disabled]="isBusy" />
    </div>
  </div>
</form>
