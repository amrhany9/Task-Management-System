<div class="bg-ambient flex min-h-screen flex-col bg-surface-50 dark:bg-surface-950">
  <div class="absolute right-6 top-6">
    <button
      type="button"
      class="inline-flex cursor-pointer items-center gap-1.5 rounded-xl border border-surface-200 bg-white/80 px-3 py-1.5 text-xs font-semibold text-surface-700 shadow-sm backdrop-blur-sm transition hover:bg-surface-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 dark:border-surface-800 dark:bg-surface-900/80 dark:text-surface-300 dark:hover:bg-surface-800"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="themeService.toggle()"
    >
      @if (themeService.theme() === 'dark') {
        <svg class="h-4 w-4 text-primary-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <span>Light</span>
      } @else {
        <svg class="h-4 w-4 text-primary-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
        </svg>
        <span>Dark</span>
      }
    </button>
  </div>

  <!-- router-outlet renders the routed component as a sibling, so centring has to
       work on that element: the component host is block w-full (see styles.css)
       and centres its own card with mx-auto. -->
  <main class="flex min-h-screen flex-col items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <router-outlet />
  </main>
</div>
