<div class="bg-ambient flex min-h-screen flex-col bg-surface-50 font-sans text-surface-900 dark:bg-surface-950 dark:text-surface-100">
  @if (authService.isAuthenticated()) {
    <header
      class="sticky top-0 z-40 border-b border-surface-200/80 bg-white/90 shadow-2xs backdrop-blur-2xl transition-colors dark:border-surface-800 dark:bg-surface-900/90"
    >
      <div class="w-full px-4 sm:px-8 lg:px-12">
        <div class="flex h-16 items-center justify-between">
          <!-- Brand, pinned top-left -->
          <div class="flex items-center gap-8">
            <a class="group flex items-center gap-3" routerLink="/projects" (click)="closeMenu()">
              <app-brand-mark />
              <div class="flex flex-col">
                <span class="text-base font-extrabold leading-tight tracking-tight text-surface-900 dark:text-white">
                  Task Management
                </span>
                <span class="text-[9px] font-bold tracking-wider text-primary-600 dark:text-primary-400">
                  PROJECTS &amp; TASKS
                </span>
              </div>
            </a>

            <nav class="hidden items-center gap-1 md:flex">
              <a
                routerLink="/projects"
                routerLinkActive="bg-primary-50 dark:bg-primary-950/60 text-primary-600 dark:text-primary-400 font-bold"
                class="rounded-xl px-3.5 py-2 text-sm font-medium text-surface-600 transition-all duration-150 hover:bg-surface-100/70 hover:text-surface-900 dark:text-surface-300 dark:hover:bg-surface-800/70 dark:hover:text-white"
              >
                Projects
              </a>
            </nav>
          </div>

          <!-- Right actions -->
          <div class="flex items-center gap-2.5 sm:gap-3">
            <button
              type="button"
              class="btn-ghost btn-sm"
              [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
              (click)="themeService.toggle()"
            >
              @if (themeService.theme() === 'dark') {
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <circle cx="12" cy="12" r="4" />
                  <path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
              } @else {
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
                </svg>
              }
            </button>

            <!-- Desktop: identity and logout inline -->
            <div class="hidden items-center gap-2.5 border-l border-surface-200 pl-3 sm:flex dark:border-surface-800">
              <span
                class="flex h-9 w-9 items-center justify-center rounded-xl bg-linear-to-tr from-primary-600 to-indigo-500 text-xs font-bold text-white shadow-sm ring-2 ring-primary-500/20"
              >
                {{ userInitials() }}
              </span>

              <div class="hidden flex-col lg:flex">
                <span class="text-xs font-bold leading-tight text-surface-900 dark:text-white">
                  {{ authService.currentUser()?.name }}
                </span>
                <span class="max-w-35 truncate text-[10px] text-surface-400">
                  {{ authService.currentUser()?.email }}
                </span>
              </div>

              <button type="button" class="btn-ghost btn-sm" (click)="logout()">
                <svg class="h-4 w-4 text-rose-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span>Log out</span>
              </button>
            </div>

            <!-- Mobile: collapse identity and logout behind a menu button -->
            <button
              type="button"
              class="btn-ghost btn-sm sm:hidden"
              aria-label="Account menu"
              aria-haspopup="true"
              [attr.aria-expanded]="isMenuOpen()"
              (click)="toggleMenu()"
            >
              <span
                class="flex h-7 w-7 items-center justify-center rounded-lg bg-linear-to-tr from-primary-600 to-indigo-500 text-[11px] font-bold text-white"
              >
                {{ userInitials() }}
              </span>
            </button>
          </div>
        </div>

        @if (isMenuOpen()) {
          <div class="animate-slide-down flex flex-col gap-1 border-t border-surface-100 py-3 sm:hidden dark:border-surface-800">
            <p class="px-4 text-sm font-bold text-surface-900 dark:text-white">{{ authService.currentUser()?.name }}</p>
            <p class="px-4 text-xs text-surface-500 dark:text-surface-400">{{ authService.currentUser()?.email }}</p>
            <a
              routerLink="/projects"
              (click)="closeMenu()"
              routerLinkActive="bg-primary-50 text-primary-600 font-bold dark:bg-primary-950/60 dark:text-primary-400"
              class="mt-2 rounded-xl px-4 py-2.5 text-sm font-medium text-surface-700 transition hover:bg-surface-50 dark:text-surface-300 dark:hover:bg-surface-800"
            >
              Projects
            </a>
            <button type="button" class="btn-secondary mx-4 mt-2" (click)="logout()">Log out</button>
          </div>
        }
      </div>
    </header>
  }

  <main class="w-full flex-1 px-4 py-6 sm:px-8 sm:py-8 lg:px-12">
    <router-outlet />
  </main>
</div>
