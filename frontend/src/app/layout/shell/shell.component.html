<div class="flex min-h-screen flex-col">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-16 w-full max-w-5xl items-center justify-between px-4 sm:px-6">
      <a class="flex items-center gap-2.5 text-slate-900" routerLink="/projects">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white">
          TM
        </span>
        <span class="text-base font-semibold tracking-tight">Task Management</span>
      </a>

      @if (authService.isAuthenticated()) {
        <div class="flex items-center gap-3">
          <div class="hidden items-center gap-2.5 sm:flex">
            <span
              class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-200 text-xs font-semibold text-slate-600"
            >
              {{ userInitials() }}
            </span>
            <span class="text-sm font-medium text-slate-700">{{ authService.currentUser()?.name }}</span>
          </div>
          <button type="button" class="btn-secondary" (click)="logout()">Log out</button>
        </div>
      }
    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-8 sm:px-6 sm:py-10">
    <router-outlet />
  </main>
</div>
