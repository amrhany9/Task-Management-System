<div class="flex min-h-screen flex-col">
  <header
    class="sticky top-0 z-10 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-900/80"
  >
    <div class="mx-auto flex h-16 w-full max-w-5xl items-center justify-between px-4 sm:px-6">
      <a class="flex items-center gap-2.5 text-slate-900 dark:text-slate-100" routerLink="/projects">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white">
          TM
        </span>
        <span class="text-base font-semibold tracking-tight">Task Management</span>
      </a>

      <div class="flex items-center gap-2">
        <button
          type="button"
          class="btn-ghost"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
          (click)="themeService.toggle()"
        >
          @if (themeService.theme() === 'dark') {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          } @else {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
            </svg>
          }
        </button>

        @if (authService.isAuthenticated()) {
          <!-- Desktop: identity and logout inline. -->
          <div class="hidden items-center gap-3 sm:flex">
            <div class="flex items-center gap-2.5">
              <span
                class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-200 text-xs font-semibold text-slate-600 dark:bg-slate-700 dark:text-slate-200"
              >
                {{ userInitials() }}
              </span>
              <span class="text-sm font-medium text-slate-700 dark:text-slate-200">
                {{ authService.currentUser()?.name }}
              </span>
            </div>
            <button type="button" class="btn-secondary" (click)="logout()">Log out</button>
          </div>

          <!-- Mobile: collapse the same controls behind a menu button. -->
          <button
            type="button"
            class="btn-ghost sm:hidden"
            aria-label="Account menu"
            aria-haspopup="true"
            [attr.aria-expanded]="isMenuOpen()"
            (click)="toggleMenu()"
          >
            <span
              class="flex h-7 w-7 items-center justify-center rounded-full bg-slate-200 text-xs font-semibold text-slate-600 dark:bg-slate-700 dark:text-slate-200"
            >
              {{ userInitials() }}
            </span>
          </button>
        }
      </div>
    </div>

    @if (authService.isAuthenticated() && isMenuOpen()) {
      <div class="border-t border-slate-200 px-4 py-3 sm:hidden dark:border-slate-800">
        <p class="text-sm font-medium text-slate-700 dark:text-slate-200">{{ authService.currentUser()?.name }}</p>
        <p class="mt-0.5 text-xs text-slate-500 dark:text-slate-400">{{ authService.currentUser()?.email }}</p>
        <button type="button" class="btn-secondary mt-3 w-full" (click)="logout()">Log out</button>
      </div>
    }
  </header>

  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-8 sm:px-6 sm:py-10">
    <router-outlet />
  </main>
</div>
