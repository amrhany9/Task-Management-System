<div class="flex flex-col gap-4">
  <div class="flex items-center gap-3" aria-hidden="true">
    <span class="h-px flex-1 bg-surface-200 dark:bg-surface-800"></span>
    <span class="text-xs font-semibold uppercase tracking-wider text-surface-400 dark:text-surface-500">or</span>
    <span class="h-px flex-1 bg-surface-200 dark:bg-surface-800"></span>
  </div>

  <div class="flex justify-center" [class.pointer-events-none]="disabled" [class.opacity-50]="disabled">
    <!-- Google renders its button inside this host; its interior cannot be restyled. -->
    <div #buttonHost></div>

    @if (!isReady()) {
      <div class="skeleton h-10 w-full max-w-[360px] rounded-lg"></div>
    }
  </div>
</div>
