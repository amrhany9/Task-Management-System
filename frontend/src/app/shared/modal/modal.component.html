<div
  class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto p-4 sm:p-6"
  (keydown)="onKeydown($event)"
>
  <div
    class="fixed inset-0 bg-surface-950/60 backdrop-blur-sm transition-opacity duration-200"
    (click)="onBackdropClick()"
  ></div>

  <div
    #panel
    class="animate-fade-scale-in relative z-10 flex max-h-[90vh] w-full flex-col overflow-hidden rounded-3xl border border-surface-200/90 bg-white shadow-modal dark:border-surface-800 dark:bg-surface-900"
    [class]="sizeClass"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    [attr.aria-describedby]="subtitle ? 'modal-subtitle' : null"
  >
    <div
      class="flex items-center justify-between gap-4 border-b border-l-4 border-surface-100 border-l-primary-600 bg-surface-50/50 px-6 py-5 sm:px-8 dark:border-surface-800 dark:border-l-primary-600 dark:bg-surface-800/30"
    >
      <div class="min-w-0">
        <h2 id="modal-title" class="text-base font-bold tracking-tight text-surface-900 sm:text-lg dark:text-surface-100">
          {{ title }}
        </h2>
        @if (subtitle) {
          <p id="modal-subtitle" class="mt-0.5 text-xs text-surface-500 dark:text-surface-400">{{ subtitle }}</p>
        }
      </div>

      <button
        type="button"
        class="shrink-0 cursor-pointer rounded-xl p-1.5 text-surface-400 transition hover:bg-surface-100 hover:text-surface-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 disabled:cursor-not-allowed disabled:opacity-50 dark:hover:bg-surface-800 dark:hover:text-surface-200"
        aria-label="Close dialog"
        [disabled]="isBusy"
        (click)="requestClose()"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-6 sm:p-8">
      <ng-content />
    </div>

    <div
      class="flex items-center justify-end gap-3 border-t border-surface-100 px-6 py-4 empty:hidden sm:px-8 dark:border-surface-800"
    >
      <ng-content select="[slot=footer]" />
    </div>
  </div>
</div>
