<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm"
  (click)="cancel.emit()"
>
  <div
    class="card w-full max-w-sm p-6"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    aria-describedby="confirm-dialog-message"
    (click)="$event.stopPropagation()"
    (keydown.escape)="cancel.emit()"
  >
    <h2 id="confirm-dialog-title" class="text-base font-semibold text-slate-900 dark:text-slate-100">
      {{ title }}
    </h2>
    <p id="confirm-dialog-message" class="mt-2 text-sm text-slate-500 dark:text-slate-400">
      {{ message }}
    </p>

    <div class="mt-6 flex justify-end gap-2">
      <button type="button" class="btn-secondary" [disabled]="isBusy" (click)="cancel.emit()">
        {{ cancelLabel }}
      </button>
      <button
        #confirmButton
        type="button"
        class="btn-danger"
        [disabled]="isBusy"
        (click)="confirm.emit()"
        (keydown.escape)="cancel.emit()"
      >
        {{ isBusy ? 'Deleting…' : confirmLabel }}
      </button>
    </div>
  </div>
</div>
